server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:team_a_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: "your-app-password" # Use a 16-character App Password generated from Google Account
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

